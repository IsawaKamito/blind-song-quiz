<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盲播猜歌</title>

<style>
:root{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#202124;
  background:#f5f6f8
}

*{box-sizing:border-box}

body{
  margin:0
}

.wrap{
  max-width:920px;
  margin:28px auto;
  padding:0 16px
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 3px 14px #00000012
}

h1{
  margin:0 0 8px
}

h2{
  margin:0 0 12px;
  font-size:20px
}

.muted{
  color:#69707d;
  font-size:14px
}

textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  padding:12px;
  border:1px solid #cfd3da;
  border-radius:10px;
  font:inherit
}

button,
select{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer
}

button{
  background:#222;
  color:#fff
}

button.secondary{
  background:#e9ebef;
  color:#222
}

button.danger{
  background:#e9ebef;
  color:#b42318
}

button:disabled{
  opacity:.4;
  cursor:not-allowed
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:12px
}

.controls label{
  font-size:14px
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}

.status{
  min-height:24px;
  margin:10px 0;
  font-weight:600
}

.answer{
  font-size:24px;
  font-weight:700;
  min-height:34px;
  margin:12px 0;
  word-break:break-word
}

.count{
  font-size:18px;
  font-weight:700
}

.timer{
  font-variant-numeric:tabular-nums;
  font-size:28px
}

.hidden{
  display:none
}

.blindBox{
  width:100%;
  height:260px;
  background:#111;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  margin:14px 0
}

.blindTitle{
  font-size:34px;
  font-weight:700
}

.blindSub{
  margin-top:10px;
  color:#aaa;
  font-size:15px
}

.controlTitle{
  font-size:14px;
  color:#69707d;
  margin:16px 0 4px
}

/* 完全隱藏 YouTube 播放器 */
#playerWrap{
  position:absolute;
  width:1px;
  height:1px;
  left:-9999px;
  top:-9999px;
  overflow:hidden
}

#player{
  width:1px;
  height:1px
}
</style>
</head>

<body>

<div class="wrap">

  <!-- 設定 -->
  <section id="setup" class="card">

    <h1>🎵 盲播猜歌</h1>

    <p class="muted">
      每行貼一個 YouTube 網址即可，不需要輸入歌名。
    </p>

    <textarea
      id="songs"
      placeholder="https://www.youtube.com/watch?v=vB8sxY_PJ_w
https://www.youtube.com/watch?v=BY7CnLX5Mk0"></textarea>

    <div class="controls">

      <label>
        盲播秒數
        <select id="duration">
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20" selected>20</option>
          <option value="30">30</option>
        </select>
        秒
      </label>

      <label>
        <input id="shuffle" type="checkbox" checked>
        隨機順序
      </label>

      <button id="clearBtn" class="danger">
        🗑️ 全部清除
      </button>

      <button id="startBtn">
        開始遊戲
      </button>

    </div>

  </section>


  <!-- 遊戲 -->
  <section id="game" class="card hidden">

    <div class="row">
      <span id="progress" class="count"></span>
      <span id="timer" class="timer"></span>
    </div>


    <!-- 黑色盲播區 -->
    <div class="blindBox">

      <div>

        <div class="blindTitle">
          🎵 <span id="blindText">準備盲播</span>
        </div>

        <div class="blindSub">
          請聽歌並猜歌
        </div>

      </div>

    </div>


    <!-- 隱藏 YouTube -->
    <div id="playerWrap">
      <div id="player"></div>
    </div>


    <div id="status" class="status">
      播放器準備中……
    </div>


    <!-- 主要控制 -->
    <div class="controlTitle">
      播放控制
    </div>

    <div class="row">

      <button id="playBtn">
        ▶ 盲播 20 秒
      </button>

      <button id="pauseBtn" class="secondary">
        ⏸ 暫停
      </button>

      <button id="resumeBtn" class="secondary">
        ▶ 繼續
      </button>

      <button id="continueBtn" class="secondary">
        ⏭ 結束後繼續
      </button>

    </div>


    <!-- 跳轉 -->
    <div class="controlTitle">
      跳轉位置
    </div>

    <div class="row">

      <button
        class="secondary seekBtn"
        data-seek="0">
        ⏮ 0:00
      </button>

      <button
        class="secondary seekBtn"
        data-seek="60">
        1:00
      </button>

      <button
        class="secondary seekBtn"
        data-seek="120">
        2:00
      </button>

      <button
        class="secondary seekBtn"
        data-seek="180">
        3:00
      </button>

    </div>


    <!-- 其他 -->
    <div class="controlTitle">
      其他
    </div>

    <div class="row">

      <button id="revealBtn" class="secondary">
        👀 揭曉答案
      </button>

      <button id="nextBtn" class="secondary">
        下一首 →
      </button>

      <button id="resetBtn" class="secondary">
        重新設定
      </button>

    </div>


    <div id="answer" class="answer"></div>

  </section>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;

let songs = [];
let order = [];
let pos = 0;

let countdownTimer = null;
let stopTimer = null;

let remainingSeconds = 0;
let isCountdownRunning = false;
let blindFinished = false;

let ytReady = false;
let ytReadyQueue = [];


/* -------------------------
   基本工具
------------------------- */

const $ = id =>
  document.getElementById(id);


/* YouTube API 載入完成 */

function onYouTubeIframeAPIReady(){

  ytReady = true;

  ytReadyQueue.forEach(fn => fn());

  ytReadyQueue = [];

}


function whenYTReady(fn){

  if(ytReady){
    fn();
  }else{
    ytReadyQueue.push(fn);
  }

}


/* -------------------------
   取得 YouTube Video ID
------------------------- */

function getVideoId(raw){

  try{

    const u =
      new URL(raw.trim());

    if(
      u.hostname === 'youtu.be' ||
      u.hostname.endsWith('.youtu.be')
    ){

      return u.pathname
        .slice(1)
        .split('/')[0];

    }

    const v =
      u.searchParams.get('v');

    if(v){
      return v;
    }

    const m =
      u.pathname.match(
        /\/(?:shorts|embed)\/([^/?]+)/
      );

    return m ? m[1] : null;

  }catch{

    return null;

  }

}


/* -------------------------
   解析歌曲
------------------------- */

function parseLine(line){

  const text =
    line.trim();

  if(!text){
    return null;
  }

  const id =
    getVideoId(text);

  if(!id){
    return null;
  }

  return {
    id:id,
    url:text,
    title:'',
    duration:0
  };

}


/* -------------------------
   YouTube 標題
------------------------- */

function getCurrentVideoTitle(){

  try{

    if(!player){
      return null;
    }

    const data =
      player.getVideoData();

    if(
      data &&
      data.title
    ){

      return data.title;

    }

  }catch(error){

    console.log(
      '取得 YouTube 標題失敗',
      error
    );

  }

  return null;

}


/* -------------------------
   播放器
------------------------- */

function loadVideo(){

  clearTimers();

  remainingSeconds = 0;
  isCountdownRunning = false;
  blindFinished = false;

  const song =
    songs[order[pos]];


  $('progress').textContent =
    `第 ${pos + 1} / ${order.length} 首`;

  $('timer').textContent =
    '';

  $('answer').textContent =
    '';

  $('blindText').textContent =
    '準備盲播';

  $('status').textContent =
    '播放器準備中……';


  resetSeekButtons();


  whenYTReady(() => {

    if(player){

      player.loadVideoById(
        song.id
      );

      setTimeout(
        updateVideoInfo,
        800
      );

      return;

    }


    player =
      new YT.Player(
        'player',
        {

          width:'1',
          height:'1',

          videoId:song.id,

          playerVars:{
            controls:0,
            rel:0,
            playsinline:1,
            origin:location.origin
          },

          events:{
            onReady:onPlayerReady,
            onStateChange:onStateChange,
            onError:onPlayerError
          }

        }
      );

  });

}


/* -------------------------
   播放器準備
------------------------- */

function onPlayerReady(){

  updateVideoInfo();

  $('status').textContent =
    '可以開始盲播。';

}


/* -------------------------
   更新影片資訊
------------------------- */

function updateVideoInfo(){

  const song =
    songs[order[pos]];

  try{

    const title =
      getCurrentVideoTitle();

    if(title){
      song.title = title;
    }


    const duration =
      player.getDuration();

    if(duration){

      song.duration =
        duration;

      updateSeekButtons();

    }

  }catch(error){

    console.log(error);

  }

}


/* -------------------------
   YouTube 狀態
------------------------- */

function onStateChange(e){

  if(
    e.data === YT.PlayerState.PLAYING
  ){

    updateVideoInfo();

  }

}


/* -------------------------
   播放錯誤
------------------------- */

function onPlayerError(e){

  $('status').textContent =
    '這支 YouTube 影片無法播放（錯誤 ' +
    e.data +
    '）。';

}


/* -------------------------
   清除計時器
------------------------- */

function clearTimers(){

  if(countdownTimer){
    clearInterval(countdownTimer);
  }

  if(stopTimer){
    clearTimeout(stopTimer);
  }

  countdownTimer = null;
  stopTimer = null;

}


/* -------------------------
   開始一段 N 秒播放
------------------------- */

function startTimedPlayback(){

  if(!player){
    $('status').textContent =
      '播放器尚未準備好。';
    return;
  }


  clearTimers();

  blindFinished = false;

  const total =
    Number(
      $('duration').value
    );


  remainingSeconds =
    total;

  isCountdownRunning =
    true;


  $('blindText').textContent =
    '盲播中';

  $('timer').textContent =
    remainingSeconds + ' 秒';

  $('status').textContent =
    '🎵 正在播放，請猜歌！';


  player.unMute();
  player.setVolume(100);
  player.playVideo();


  countdownTimer =
    setInterval(() => {

      if(!isCountdownRunning){
        return;
      }

      remainingSeconds--;

      $('timer').textContent =
        Math.max(
          0,
          remainingSeconds
        ) + ' 秒';


      if(
        remainingSeconds <= 0
      ){

        finishTimedPlayback();

      }

    },1000);

}


/* -------------------------
   播放時間到
------------------------- */

function finishTimedPlayback(){

  clearTimers();

  remainingSeconds = 0;
  isCountdownRunning = false;

  if(player){
    player.pauseVideo();
  }

  blindFinished = true;


  $('blindText').textContent =
    '盲播結束';

  $('timer').textContent =
    '時間到';

  $('status').textContent =
    '盲播結束。可以公布答案，或繼續播放。';

}


/* -------------------------
   盲播
------------------------- */

function playBlind(){

  startTimedPlayback();

}


/* -------------------------
   暫停
------------------------- */

function pauseVideo(){

  if(!player){
    return;
  }


  player.pauseVideo();

  /*
    注意：
    不清除 countdownTimer。
    但 isCountdownRunning 設為 false，
    因此倒數會跟著暫停。
  */

  isCountdownRunning = false;


  $('status').textContent =
    '已暫停。';

}


/* -------------------------
   繼續
------------------------- */

function resumeVideo(){

  if(!player){
    return;
  }


  /*
    如果目前還有剩餘倒數，
    就從原本剩餘秒數繼續。
  */

  if(
    remainingSeconds > 0
  ){

    isCountdownRunning = true;

    player.unMute();
    player.setVolume(100);
    player.playVideo();

    $('blindText').textContent =
      '盲播中';

    $('timer').textContent =
      remainingSeconds + ' 秒';

    $('status').textContent =
      '▶ 繼續播放。';

    return;

  }


  /*
    如果目前沒有正在進行的倒數，
    則開始一段新的 N 秒。
  */

  startTimedPlayback();

}


/* -------------------------
   結束後繼續
------------------------- */

function continueAfterBlind(){

  if(!player){
    return;
  }

  startTimedPlayback();

  $('blindText').textContent =
    '繼續播放';

}


/* -------------------------
   跳轉
------------------------- */

function seekTo(seconds){

  if(!player){
    return;
  }


  const duration =
    player.getDuration();


  if(
    !duration ||
    seconds > duration
  ){
    return;
  }


  /*
    跳轉 = 新的一段 N 秒播放
  */

  player.seekTo(
    seconds,
    true
  );


  startTimedPlayback();


  $('status').textContent =
    `已跳到 ${formatTime(seconds)}，開始 ${$('duration').value} 秒播放。`;

}


/* -------------------------
   秒數格式
------------------------- */

function formatTime(seconds){

  seconds =
    Math.floor(seconds);

  const min =
    Math.floor(seconds / 60);

  const sec =
    seconds % 60;

  return (
    min +
    ':' +
    String(sec).padStart(2,'0')
  );

}


/* -------------------------
   跳轉按鈕
------------------------- */

function updateSeekButtons(){

  if(!player){
    return;
  }


  const duration =
    player.getDuration();


  document
    .querySelectorAll('.seekBtn')
    .forEach(btn => {

      const seconds =
        Number(
          btn.dataset.seek
        );

      btn.disabled =
        seconds > duration;

    });

}


function resetSeekButtons(){

  document
    .querySelectorAll('.seekBtn')
    .forEach(btn => {

      const seconds =
        Number(
          btn.dataset.seek
        );

      btn.disabled =
        seconds !== 0;

    });

}


/* -------------------------
   揭曉
------------------------- */

function reveal(){

  clearTimers();

  isCountdownRunning = false;

  if(player){
    player.pauseVideo();
  }


  $('blindText').textContent =
    '答案揭曉';

  $('timer').textContent =
    '';


  const song =
    songs[order[pos]];


  let title =
    song.title;


  if(!title){

    title =
      getCurrentVideoTitle();

    if(title){
      song.title = title;
    }

  }


  if(title){

    $('answer').textContent =
      `答案：${title}`;

    $('status').textContent =
      '已揭曉。';

  }else{

    $('answer').textContent =
      '無法取得 YouTube 標題';

    $('status').textContent =
      '請由主持人自行公布答案。';

  }

}


/* -------------------------
   下一首
------------------------- */

function next(){

  clearTimers();

  isCountdownRunning = false;

  remainingSeconds = 0;


  if(
    pos >= order.length - 1
  ){

    if(player){
      player.pauseVideo();
    }

    $('blindText').textContent =
      '全部播完！🎉';

    $('status').textContent =
      '全部歌曲都播完了！';

    $('timer').textContent =
      '';

    return;

  }


  pos++;

  loadVideo();

}


/* -------------------------
   回到設定頁
   保留歌曲
------------------------- */

function resetGame(){

  clearTimers();

  isCountdownRunning = false;
  remainingSeconds = 0;

  if(player){
    player.pauseVideo();
  }


  $('game')
    .classList
    .add('hidden');

  $('setup')
    .classList
    .remove('hidden');

}


/* -------------------------
   全部清除
------------------------- */

function clearAllSongs(){

  $('songs').value = '';

}


/* -------------------------
   開始遊戲
------------------------- */

$('startBtn').onclick =
  () => {

    songs =
      $('songs')
        .value
        .split(/\r?\n/)
        .map(parseLine)
        .filter(Boolean);


    if(!songs.length){

      alert(
        '請至少輸入一個有效的 YouTube 網址。'
      );

      return;

    }


    order =
      songs.map(
        (_,i) => i
      );


    if(
      $('shuffle').checked
    ){

      order.sort(
        () =>
          Math.random() - 0.5
      );

    }


    pos = 0;


    $('setup')
      .classList
      .add('hidden');

    $('game')
      .classList
      .remove('hidden');


    loadVideo();

  };


/* -------------------------
   盲播秒數改變時
------------------------- */

$('duration').onchange =
  () => {

    $('playBtn').textContent =
      `▶ 盲播 ${$('duration').value} 秒`;

  };


/* -------------------------
   按鈕
------------------------- */

$('playBtn').onclick =
  playBlind;

$('pauseBtn').onclick =
  pauseVideo;

$('resumeBtn').onclick =
  resumeVideo;

$('continueBtn').onclick =
  continueAfterBlind;

$('revealBtn').onclick =
  reveal;

$('nextBtn').onclick =
  next;

$('resetBtn').onclick =
  resetGame;

$('clearBtn').onclick =
  clearAllSongs;


/* -------------------------
   跳轉按鈕
------------------------- */

document
  .querySelectorAll('.seekBtn')
  .forEach(btn => {

    btn.onclick =
      () => {

        seekTo(
          Number(
            btn.dataset.seek
          )
        );

      };

  });

</script>

</body>
</html>
