<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>盲播猜歌</title>

<style>
:root{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#202124;
  background:#f5f6f8
}

*{box-sizing:border-box}

body{margin:0}

.wrap{
  max-width:920px;
  margin:28px auto;
  padding:0 16px
}

.card{
  background:#fff;
  border-radius:16px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 3px 14px #00000012
}

h1{margin:0 0 8px}
h2{margin:0 0 12px;font-size:20px}

.muted{
  color:#69707d;
  font-size:14px
}

textarea{
  width:100%;
  min-height:180px;
  resize:vertical;
  padding:12px;
  border:1px solid #cfd3da;
  border-radius:10px;
  font:inherit
}

button,select{
  font:inherit;
  border:0;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  cursor:pointer
}

button{
  background:#222;
  color:#fff
}

.secondary{
  background:#e9ebef;
  color:#222
}

.controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.controls label{
  font-size:14px
}

.status{
  min-height:24px;
  margin:10px 0;
  font-weight:600
}

.answer{
  font-size:24px;
  font-weight:700;
  min-height:34px;
  margin:12px 0
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center
}

.hidden{
  display:none
}

.count{
  font-size:18px;
  font-weight:700
}

.timer{
  font-variant-numeric:tabular-nums;
  font-size:28px
}

.blindBox{
  width:100%;
  height:260px;
  background:#111;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  margin:14px 0
}

.blindTitle{
  font-size:34px;
  font-weight:700
}

.blindSub{
  margin-top:10px;
  color:#aaa;
  font-size:15px
}

code{
  background:#eef0f3;
  padding:2px 5px;
  border-radius:5px
}

/*
  YouTube 播放器完全藏起來。
  仍然讓它存在，讓 YouTube 可以播放聲音。
*/
#playerWrap{
  position:absolute;
  width:1px;
  height:1px;
  left:-9999px;
  top:-9999px;
  overflow:hidden
}

#player{
  width:1px;
  height:1px
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">
    <h1>🎵 盲播猜歌</h1>
    <div class="muted">
      貼 YouTube 網址，一行一首。主持人播放片段，朋友在 Discord 直接猜。
    </div>
  </div>


  <!-- 設定區 -->
  <section id="setup" class="card">

    <h2>歌曲清單</h2>

    <p class="muted">
      只貼網址即可；也可以寫成
      <code>網址 | 歌名 | 歌手</code>
      方便揭曉答案。
    </p>

    <textarea id="songs"
      placeholder="https://www.youtube.com/watch?v=vB8sxY_PJ_w
https://www.youtube.com/watch?v=BY7CnLX5Mk0"></textarea>

    <div class="controls">

      <label>
        盲播秒數
        <select id="duration">
          <option>10</option>
          <option>15</option>
          <option selected>20</option>
          <option>30</option>
        </select>
      </label>

      <label>
        <input id="shuffle" type="checkbox" checked>
        隨機順序
      </label>

      <button id="startBtn">
        開始遊戲
      </button>

    </div>

  </section>


  <!-- 遊戲區 -->
  <section id="game" class="card hidden">

    <div class="row">
      <span id="progress" class="count"></span>
      <span id="timer" class="timer"></span>
    </div>


    <!--
      玩家實際看到的區域。
      不顯示 YouTube 縮圖、標題、頻道。
    -->
    <div class="blindBox">

      <div>
        <div class="blindTitle">
          🎵 <span id="blindText">準備盲播</span>
        </div>

        <div class="blindSub">
          請聽歌並猜歌名
        </div>
      </div>

    </div>


    <!--
      YouTube 播放器藏在畫面外。
      只負責播放聲音。
    -->
    <div id="playerWrap">
      <div id="player"></div>
    </div>


    <div id="status" class="status">
      按「開始盲播」播放。
    </div>


    <div class="row">

      <button id="playBtn">
        ▶ 開始盲播
      </button>

      <button id="revealBtn" class="secondary">
        👀 揭曉答案
      </button>

      <button id="nextBtn" class="secondary">
        下一首 →
      </button>

      <button id="resetBtn" class="secondary">
        重新設定
      </button>

    </div>


    <div id="answer" class="answer"></div>

  </section>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player = null;

let songs = [];
let order = [];
let pos = 0;

let timer = null;
let stopTimer = null;

let playing = false;


/* 簡單取得元素 */
const $ = id => document.getElementById(id);


/* 取得 YouTube Video ID */
function getVideoId(raw){

  try{

    const u = new URL(raw.trim());

    if(
      u.hostname === 'youtu.be' ||
      u.hostname.endsWith('.youtu.be')
    ){
      return u.pathname.slice(1).split('/')[0];
    }

    const v = u.searchParams.get('v');

    if(v){
      return v;
    }

    const m = u.pathname.match(
      /\/(?:shorts|embed)\/([^/?]+)/
    );

    return m ? m[1] : null;

  }catch{

    return null;

  }

}


/* 解析歌曲 */
function parseLine(line){

  const p = line
    .split('|')
    .map(x => x.trim());

  const id = getVideoId(p[0]);

  if(!id){
    return null;
  }

  return {
    id:id,
    title:p[1] || '',
    artist:p[2] || ''
  };

}


/* YouTube API 初始化 */
function onYouTubeIframeAPIReady(){

  /*
    API 載入完成。
    真正的播放器會在第一首歌開始時建立。
  */

}


/* 清除計時器 */
function clearTimers(){

  if(timer){
    clearInterval(timer);
  }

  if(stopTimer){
    clearTimeout(stopTimer);
  }

  timer = null;
  stopTimer = null;

}


/* 載入目前歌曲 */
function loadVideo(){

  clearTimers();

  playing = false;

  const s = songs[order[pos]];

  $('progress').textContent =
    `第 ${pos + 1} / ${order.length} 首`;

  $('timer').textContent = '';

  $('answer').textContent = '';

  $('blindText').textContent = '準備盲播';

  $('status').textContent =
    '按「開始盲播」播放。';


  /*
    如果播放器已存在，就載入新影片。
  */

  if(player){

    player.loadVideoById(s.id);

    player.stopVideo();

    return;

  }


  /*
    第一次建立播放器。
    播放器在畫面外，不會被玩家看到。
  */

  player = new YT.Player(
    'player',
    {

      width:'1',
      height:'1',

      videoId:s.id,

      playerVars:{
        controls:0,
        rel:0,
        playsinline:1,
        origin:location.origin
      },

      events:{
        onReady:onPlayerReady,
        onStateChange:onStateChange,
        onError:onPlayerError
      }

    }
  );

}


/* YouTube 準備完成 */
function onPlayerReady(){

  $('status').textContent =
    '按「開始盲播」播放。';

}


/* YouTube 播放錯誤 */
function onPlayerError(e){

  $('status').textContent =
    '這支 YouTube 影片無法播放（錯誤 ' +
    e.data +
    '），請換一支影片。';

}


/*
  當 YouTube 真正開始播放時，
  才開始盲播倒數。
*/
function onStateChange(e){

  if(
    e.data === YT.PlayerState.PLAYING &&
    !playing
  ){

    playing = true;

    beginBlind();

  }

}


/* 開始盲播 */
function beginBlind(){

  $('blindText').textContent =
    '盲播中';

  $('status').textContent =
    '🎵 正在播放，請猜歌！';

  const total =
    Number($('duration').value);

  let left = total;

  $('timer').textContent =
    left + ' 秒';


  clearTimers();


  timer = setInterval(
    () => {

      left--;

      $('timer').textContent =
        Math.max(0,left) + ' 秒';

    },
    1000
  );


  stopTimer = setTimeout(
    () => {

      clearTimers();

      if(player){
        player.pauseVideo();
      }

      playing = false;

      $('blindText').textContent =
        '時間到！';

      $('timer').textContent =
        '時間到';

      $('status').textContent =
        '時間到！可以公布答案了。';

    },
    total * 1000
  );

}


/* 開始盲播 */
function playBlind(){

  if(!player){

    $('status').textContent =
      '播放器尚未準備好，請稍候。';

    return;

  }


  $('status').textContent =
    '正在播放…';


  /*
    嘗試解除靜音並播放。
  */

  player.unMute();

  player.setVolume(100);

  player.playVideo();


  /*
    如果瀏覽器阻擋自動播放，
    提示主持人點一下播放。
  */

  setTimeout(
    () => {

      if(!playing){

        $('status').textContent =
          '如果沒有播放聲音，請再按一次「開始盲播」。';

      }

    },
    1000
  );

}


/* 揭曉答案 */
function reveal(){

  clearTimers();

  if(player){
    player.pauseVideo();
  }

  playing = false;

  $('blindText').textContent =
    '答案揭曉';

  $('timer').textContent = '';

  const s =
    songs[order[pos]];


  if(s.title){

    $('answer').textContent =
      `答案：${s.title}` +
      (s.artist ? ` — ${s.artist}` : '');

  }else{

    $('answer').textContent =
      '答案請由主持人自行揭曉';

  }


  $('status').textContent =
    '已揭曉。';

}


/* 下一首 */
function next(){

  if(pos >= order.length - 1){

    $('blindText').textContent =
      '全部播完！🎉';

    $('status').textContent =
      '全部歌曲都播完了！';

    $('timer').textContent = '';

    return;

  }


  pos++;

  loadVideo();

}


/* 重新設定 */
function reset(){

  location.reload();

}


/* 開始遊戲 */
$('startBtn').onclick = () => {

  songs =
    $('songs')
      .value
      .split(/\r?\n/)
      .map(parseLine)
      .filter(Boolean);


  if(!songs.length){

    alert(
      '請至少輸入一個有效的 YouTube 網址'
    );

    return;

  }


  order =
    songs.map((_,i) => i);


  if($('shuffle').checked){

    order.sort(
      () => Math.random() - 0.5
    );

  }


  pos = 0;


  $('setup')
    .classList
    .add('hidden');

  $('game')
    .classList
    .remove('hidden');


  loadVideo();

};


/* 按鈕 */
$('playBtn').onclick = playBlind;

$('revealBtn').onclick = reveal;

$('nextBtn').onclick = next;

$('resetBtn').onclick = reset;

</script>

</body>
</html>
